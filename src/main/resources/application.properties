spring.kafka.bootstrap-servers=72.61.144.159:9092

# JWT signing key: the ONE platform-wide key shared by every afriSecurity service and every token issuer (uaa,
# KSC's own UAA, AfriStudio, courtApp, jot-portal). This service verifies (tokens from KSC's own UAA) and forwards them to payment-service.
# Set SECURITY_JWT_SECRET_KEY in every shared or production environment (AfriStudio/docs/jwt-secret-rollout.md).
# The default is the local-development key the other services also use; without this line afriSecurity falls back to
# its public "default-secret" and rejects tokens ("The Token's Signature resulted invalid ... HmacSHA256").
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:local-dev-only-jwt-secret-change-me-0123456789abcdef}
